<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aminoacids</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Aminoacids</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>1-letter</th>
            <th>3-letter</th>
            <th>Molecular formula</th>
            <th>Property</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
