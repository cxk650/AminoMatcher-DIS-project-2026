<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Over</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }
        .btn {
            display: block;
            width: 250px;
            margin: 15px auto;
            padding: 14px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        .btn-secondary {
            background-color: #555;
        }
        .btn-start {
            background-color: #2196F3;
        }
    </style>
</head>
<body>

    <h1>Game Over</h1>
    <h2>Your score: {{ score }} / {{ total }}</h2>

    <!-- Play again with SAME mode + question type -->
    <a class="btn" href="/restart_same">Play again (same settings)</a>

    <!-- Go back to mode selection -->
    <a class="btn btn-secondary" href="/modes">Change game settings</a>

    <!-- Go back to start page -->
    <a class="btn btn-start" href="/">Go back to start page</a>

</body>
</html>
